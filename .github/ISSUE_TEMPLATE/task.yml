name: Roadmap task
description: A task from docs/ROADMAP.md (T<phase>.<n>)
title: "T0.0: <task title>"
labels: ["type:task"]
body:
  - type: input
    id: task
    attributes:
      label: Task id
      placeholder: T1.4
    validations:
      required: true
  - type: textarea
    id: build
    attributes:
      label: Build
      description: Copied from the roadmap task.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: Verify
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
  - type: input
    id: refs
    attributes:
      label: Architecture references
      placeholder: "§21.4, §22.3"
