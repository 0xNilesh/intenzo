name: Bug
description: Something Intenzo does wrong
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened vs what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Run id, logs, trace, screenshots. Never paste secrets.
