name: CI

# The `check` job is the required status check for merging into main. It runs every offline
# test layer across the whole workspace, so a PR can't merge if it breaks anything that already
# works. Live model tests (*.live.test.ts) are not run in CI for now: they cost model credits,
# so they're run by hand with `pnpm test:live`.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Contract tests
        run: pnpm test:contract

      - name: Detect browser tests
        id: layers
        run: |
          count=$(git ls-files '*.browser.test.ts' | wc -l | tr -d ' ')
          echo "browser=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "browser test files: $count"

      - name: Cache Playwright browsers
        if: steps.layers.outputs.browser == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.layers.outputs.browser == 'true'
        run: pnpm --filter @intenzo/core exec playwright install --with-deps chromium

      - name: Browser tests
        if: steps.layers.outputs.browser == 'true'
        run: pnpm test:browser
