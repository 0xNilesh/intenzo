name: CI

# The `check` job is the required status check for merging into main. It runs every offline
# test layer across the whole workspace, so a PR can't merge if it breaks anything that already
# works. Live model tests (*.live.test.ts) are not run in CI for now: they cost model credits,
# so they're run by hand with `pnpm test:live`.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A real Postgres for the *.pg.test.ts tests (concurrent connections, which PGlite can't give).
    # The same major and minor as Neon's.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Contract tests
        run: pnpm test:contract

      - name: Modal shim tests
        run: pnpm test:modal

      - name: Analysis tests
        # IntentBench's metrics and charts (bench/analysis, T6.4), in a venv with the pinned libraries.
        run: |
          python3 -m venv /tmp/analysis-venv
          /tmp/analysis-venv/bin/pip install --quiet -r bench/analysis/requirements.txt
          /tmp/analysis-venv/bin/python -m pytest -q -p no:cacheprovider bench/analysis

      - name: Postgres tests
        run: pnpm test:pg
        env:
          INTENZO_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Detect browser tests
        id: layers
        run: |
          count=$(git ls-files '*.browser.test.ts' | wc -l | tr -d ' ')
          echo "browser=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "browser test files: $count"

      - name: Cache Playwright browsers
        if: steps.layers.outputs.browser == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.layers.outputs.browser == 'true'
        run: pnpm --filter @intenzo/core exec playwright install --with-deps chromium

      - name: Install ffmpeg
        if: steps.layers.outputs.browser == 'true'
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)

      - name: Browser tests
        if: steps.layers.outputs.browser == 'true'
        run: pnpm test:browser
