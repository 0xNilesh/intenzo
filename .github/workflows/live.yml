name: Live model tests

# Live tests (*.live.test.ts) call real Meta / Baseten APIs. They cost credits, need secrets and
# aren't deterministic, so they never gate a PR. They run nightly, on demand, and on a PR when
# the `run-live` label is added (once per labeling: remove and re-add it to run again).

on:
  schedule:
    - cron: "0 2 * * *" # daily, 02:00 UTC
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    name: live
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-live'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      META_API_KEY: ${{ secrets.META_API_KEY }}
      BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect live tests
        id: layers
        run: |
          count=$(git ls-files '*.live.test.ts' | wc -l | tr -d ' ')
          echo "live=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "live test files: $count"

      - uses: pnpm/action-setup@v6
        if: steps.layers.outputs.live == 'true'

      - uses: actions/setup-node@v7
        if: steps.layers.outputs.live == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.layers.outputs.live == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: steps.layers.outputs.live == 'true'
        run: pnpm --filter @intenzo/core exec playwright install --with-deps chromium

      - name: Live tests
        if: steps.layers.outputs.live == 'true'
        run: pnpm test:live
